name: Flex-to-Dylib CI

on:
  push:
    paths:
      - 'patch.plist'
      - '.github/workflows/**'
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          brew install ldid xz
          echo "/opt/homebrew/bin" >> $GITHUB_PATH
          sudo ln -sf /opt/homebrew/bin/ldid /usr/local/bin/ldid || true

      - name: Setup Theos & SDK
        run: |
          sudo git clone --recursive --depth 1 https://github.com/theos/theos.git /opt/theos
          sudo chown -R $USER /opt/theos
          echo "THEOS=/opt/theos" >> $GITHUB_ENV
          rm -rf /opt/theos/sdks
          git clone --depth 1 https://github.com/theos/sdks.git /opt/theos/sdks

      - name: Convert Plist to Logos (Tweak.x)
        run: |
          python3 -c '
          import plistlib, os

          def parse_plist():
              if not os.path.exists("patch.plist"):
                  print("错误: 未找到 patch.plist 文件")
                  exit(1)
              
              with open("patch.plist", "rb") as f:
                  data = plistlib.load(f)

              logos = ["#import <UIKit/UIKit.h>\n"]

              # 1. 自动适配 AppFix 格式 plist
              if isinstance(data, dict) and "apps" in data:
                  apps = data.get("apps", {})
                  for bundle_id, app_info in apps.items():
                      rules = app_info.get("rules", [])
                      for rule in rules:
                          if not rule.get("enabled", True):
                              continue
                          
                          target_class = rule.get("class")
                          selector = rule.get("selector")
                          types = rule.get("types", "")

                          if not target_class or not selector:
                              continue

                          # 根据 iOS Type Encoding 判断返回值
                          ret_type = "void"
                          ret_stmt = ""
                          if types:
                              if types.startswith("v"):
                                  ret_type = "void"
                                  ret_stmt = ""
                              elif types.startswith("@"):
                                  ret_type = "id"
                                  ret_stmt = "return nil;"
                              elif types.startswith("B") or types.startswith("c"):
                                  ret_type = "BOOL"
                                  ret_stmt = "return NO;"
                              else:
                                  ret_type = "NSInteger"
                                  ret_stmt = "return 0;"

                          # 还原 Objective-C 方法签名
                          if ":" in selector:
                              parts = selector.split(":")
                              sig_parts = []
                              arg_idx = 1
                              for p in parts[:-1]:
                                  sig_parts.append(f"{p}:(id)arg{arg_idx}")
                                  arg_idx += 1
                              method_sig = f"-({ret_type})" + " ".join(sig_parts)
                          else:
                              method_sig = f"-({ret_type}){selector}"

                          logos.append(f"%hook {target_class}")
                          logos.append(f"{method_sig} {{")
                          if ret_stmt:
                              logos.append(f"    {ret_stmt}")
                          logos.append("}\n%end\n")

              # 2. 自动适配标准 Flex 3 格式 plist
              else:
                  patches = data.get("Patches", [data]) if isinstance(data, dict) else data
                  for patch in patches:
                      units = patch.get("Units", [])
                      for unit in units:
                          target = unit.get("TargetClass")
                          method = unit.get("MethodObj", {})
                          display_name = method.get("displayName")
                          overrides = unit.get("Overrides", [])

                          if not target or not display_name:
                              continue

                          ret_val = None
                          for ov in overrides:
                              if ov.get("argument") == 0:
                                  val = ov.get("value", {})
                                  if isinstance(val, dict):
                                      for k, v in val.items():
                                          if k.upper() in ["BOOL", "BOOLEAN"]:
                                              ret_val = "YES" if v else "NO"
                                          elif k.lower() in ["id", "string"]:
                                              ret_val = "nil" if v in ["(NULL)", "", None] else f"@{repr(v)}"
                                          else:
                                              ret_val = str(v)

                          logos.append(f"%hook {target}")
                          logos.append(f"{display_name} {{")
                          if ret_val is not None:
                              logos.append(f"    return {ret_val};")
                          else:
                              logos.append("    %orig;")
                          logos.append("}\n%end\n")

              with open("Tweak.x", "w", encoding="utf-8") as f:
                  f.write("\n".join(logos))
              print("已成功解析 patch.plist 并生成 Tweak.x")

          parse_plist()
          '
          echo "------ 自动生成的 Tweak.x 代码预览 ------"
          cat Tweak.x
          echo "---------------------------------------"

      - name: Generate Makefile
        run: |
          cat << 'EOF' > Makefile
          TARGET := iphone:clang:latest:14.0
          ARCHS = arm64 arm64e

          include $(THEOS)/makefiles/common.mk

          TWEAK_NAME = PatchTweak
          PatchTweak_FILES = Tweak.x
          PatchTweak_CFLAGS = -fobjc-arc
          PatchTweak_LDFLAGS += -Wl,-segalign,4000

          include $(THEOS_MAKE_PATH)/tweak.mk
          EOF

      - name: Build Dylib
        run: |
          make FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Generated-Dylib
          path: .theos/obj/**/*.dylib
