name: Flex-to-Dylib CI

on:
  push:
    paths:
      - 'patch.plist'
      - '.github/workflows/**'
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          brew install ldid xz || true

      - name: Setup Flex2Theos Tool
        env:
          GIT_TERMINAL_PROMPT: 0
        run: |
          # 自动注入 GITHUB_TOKEN，避免无交互环境下拉取子模块触发账号询问
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "git@github.com:"
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git clone --recursive https://github.com/csu/flex2theos.git
          cd flex2theos && make && sudo cp flex2theos /usr/local/bin/ && cd ..

      - name: Setup Theos & SDK
        run: |
          sudo git clone --recursive --depth 1 https://github.com/theos/theos.git /opt/theos
          sudo chown -R $USER /opt/theos
          echo "THEOS=/opt/theos" >> $GITHUB_ENV
          rm -rf /opt/theos/sdks
          git clone --depth 1 https://github.com/theos/sdks.git /opt/theos/sdks

      - name: Convert Plist to Theos Project
        run: |
          # 读取 patch.plist 并生成 PatchTweak 工程
          flex2theos -p patch.plist -o PatchTweak

      - name: Build Dylib
        run: |
          cd PatchTweak
          # 追加架构与内存对齐参数，保障 TrollStore 注入兼容性
          echo "ARCHS = arm64 arm64e" >> Makefile
          echo "PatchTweak_LDFLAGS += -Wl,-segalign,4000" >> Makefile
          
          # 执行 rootless 编译
          make FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Generated-Dylib
          path: PatchTweak/.theos/obj/**/*.dylib
